name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes texlive-binaries zip unzip
      - name: Run plugin checks
        run: ./scripts/test-plugin.sh
      - name: Build release artifact twice
        run: |
          ./scripts/package-plugin.sh
          cp dist/bookroom.koplugin.zip /tmp/bookroom.koplugin.first.zip
          ./scripts/package-plugin.sh
          cmp /tmp/bookroom.koplugin.first.zip dist/bookroom.koplugin.zip
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bookroom-koplugin
          path: |
            dist/bookroom.koplugin.zip
            dist/bookroom.koplugin.zip.sha256
